name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.17
      - run: uv sync --frozen --dev
      - run: uv run ruff check src tests scripts
      - run: uv run python scripts/validate_design.py
      - run: uv run python scripts/install_scanners.py
      - run: uv run pytest -q
